name: Package VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional extension version to package
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/orvi/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: vscode/orvi
        run: npm ci

      - name: Apply requested version
        if: ${{ inputs.version != '' }}
        working-directory: vscode/orvi
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Package extension
        working-directory: vscode/orvi
        run: npm run package -- --out orvi-language.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvi-language-vsix
          path: vscode/orvi/orvi-language.vsix
          if-no-files-found: error
