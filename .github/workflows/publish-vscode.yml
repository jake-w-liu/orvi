name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver bump passed to vsce, such as patch, minor, or 0.1.1"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/orvi/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode/orvi
        run: npm ci

      - name: Check Marketplace token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Missing required repository secret: VSCE_PAT" >&2
            exit 1
          fi

      - name: Verify Marketplace token
        working-directory: vscode/orvi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce verify-pat jake-w-liu --pat "$VSCE_PAT"

      - name: Package extension
        working-directory: vscode/orvi
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            npx vsce package "${{ inputs.version }}" --no-git-tag-version --out orvi-language.vsix
          else
            npx vsce package --out orvi-language.vsix
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvi-language-vsix
          path: vscode/orvi/orvi-language.vsix
          if-no-files-found: error

      - name: Publish extension
        working-directory: vscode/orvi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath orvi-language.vsix --pat "$VSCE_PAT" --skip-duplicate
