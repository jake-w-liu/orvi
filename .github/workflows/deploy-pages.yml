name: Deploy Playground

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "src/**"
      - "schemas/**"
      - "examples/**"
      - "scripts/build-site.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          ORVI_PAGES_CNAME: ${{ vars.ORVI_PAGES_CNAME }}
        run: npm run site:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Keep only latest Pages deployment
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment: "github-pages",
              per_page: 100,
            });

            deployments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const [latest, ...oldDeployments] = deployments;
            if (!latest) return;

            for (const deployment of oldDeployments) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                auto_inactive: false,
              });
              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id,
              });
            }
