name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: npm run verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

  coverage:
    name: Test coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage thresholds
        env:
          # Enforce the headless-Chrome render smokes here (Chrome is on the
          # runner image and Node 24 has a global WebSocket): a missing browser
          # fails the job instead of skipping.
          ORVI_REQUIRE_BROWSER: "1"
        run: npm run test:coverage

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/orvi/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Install extension dependencies
        working-directory: vscode/orvi
        run: npm ci

      - name: Audit extension dependencies
        working-directory: vscode/orvi
        run: npm audit --audit-level=high

  vscode-package:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/orvi/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: vscode/orvi
        run: npm ci

      - name: Package extension
        working-directory: vscode/orvi
        run: npm run package -- --out orvi-language.vsix
