version: 2
updates:
  # Keep GitHub Actions pinned to current major tags up to date (supply chain).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Root npm package (orvi-lang).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development

  # VS Code extension workspace.
  - package-ecosystem: npm
    directory: /vscode/orvi
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(vscode)
