version: 2
updates:
  # Keep GitHub Actions pinned to current major tags up to date (supply chain).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Root npm package (orvi-lang).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Major bumps of the build/test toolchain need a deliberate migration
      # (TS module-resolution changes, ESLint flat-config churn, etc.) —
      # handle those by hand, not as an auto PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript-eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@typescript-eslint/*"
        update-types: [version-update:semver-major]
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: ts-jest
        update-types: [version-update:semver-major]
      - dependency-name: "@types/*"
        update-types: [version-update:semver-major]

  # VS Code extension workspace.
  - package-ecosystem: npm
    directory: /vscode/orvi
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(vscode)
